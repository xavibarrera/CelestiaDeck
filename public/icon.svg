<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle / circle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Constellation small stars -->
  <circle cx="120" cy="140" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="390" cy="130" r="2.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="380" cy="370" r="3.5" fill="#fbbf24" opacity="0.7" />
  <circle cx="130" cy="380" r="2.5" fill="#fbbf24" opacity="0.7" />
  <circle cx="256" cy="80" r="3" fill="#c084fc" opacity="0.9" />

  <!-- Central Celestial Portal / Aureola -->
  <circle cx="256" cy="256" r="140" fill="#1e1b4b" fill-opacity="0.6" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Subtle Tarot Card Silhouette behind Crescent -->
  <rect x="186" y="146" width="140" height="220" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="url(#goldGrad)" stroke-width="2" transform="rotate(-6 256 256)" opacity="0.85" />
  <rect x="194" y="154" width="124" height="204" rx="12" fill="none" stroke="url(#violetGrad)" stroke-width="1.2" transform="rotate(-6 256 256)" opacity="0.6" />

  <!-- Crescent Moon Symbol in Gold -->
  <path d="M 276 170 A 96 96 0 1 0 326 316 A 84 84 0 0 1 276 170 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- 8-Pointed Guiding Star -->
  <g transform="translate(230, 230) scale(0.9)">
    <polygon points="26,0 32,18 52,26 32,34 26,52 20,34 0,26 20,18" fill="url(#goldGrad)" />
    <polygon points="26,8 30,22 44,26 30,30 26,44 22,30 8,26 22,22" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Eye of Wisdom / Introspection below -->
  <path d="M 216 328 Q 256 300 296 328 Q 256 356 216 328 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9" />
  <circle cx="256" cy="328" r="6" fill="url(#goldGrad)" />
</svg>
